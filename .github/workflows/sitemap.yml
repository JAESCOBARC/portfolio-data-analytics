name: Actualizar sitemap

on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/generar_sitemap.py
      - name: Commit si cambió
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Actualizar lastmod del sitemap"
            git push
          fi
